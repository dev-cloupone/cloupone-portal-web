name = "cloupone-portal-web"
main = "src/worker.ts"
compatibility_date = "2026-04-17"

[observability]
enabled = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# --- Dev environment ---

[env.dev]
name = "cloupone-portal-web-dev"

[env.dev.assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

